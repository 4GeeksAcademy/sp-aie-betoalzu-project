# ──────────────────────────────────────────────────────────────────
# docker-compose.yml
# Basado en la especificación: specs/dockerizacion-prompt.md
# ──────────────────────────────────────────────────────────────────

# version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: nexova-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - nexova-network

  # ── Backend (FastAPI + Python) ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: nexova-backend
    ports:
      - "8000:8000"
    volumes:
      # Bind mount del código fuente para hot-reload
      - ./server.py:/app/server.py
      - ./services/:/app/services/
      - ./data/:/app/data/
      - ./scripts/:/app/scripts/
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INCIDENT_UPLOAD_DIR: /app/data/incident_analysis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexova-network
    command: >
      sh -c "uvicorn server:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: nexova-worker
    volumes:
      - ./services/:/app/services/
      - ./data/:/app/data/
      - ./scripts/:/app/scripts/
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INCIDENT_UPLOAD_DIR: /app/data/incident_analysis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexova-network
    command: ["celery", "-A", "services.celery_app:celery_app", "worker", "--loglevel=INFO", "-E"]
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: nexova-flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexova-network
    command:
      - celery
      - -A
      - services.celery_app:celery_app
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --basic-auth=${FLOWER_USER:?FLOWER_USER must be set}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}
    restart: unless-stopped

  # ── Interfaces (Next.js: backoffice + website) ─────────────────
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: nexova-interfaces
    ports:
      - "3000:3000"   # Website
      - "3001:3001"   # Backoffice
    volumes:
      # Bind mount del código fuente para hot-reload
      - ./uis/backoffice/:/app/backoffice/
      - ./uis/website/:/app/website/
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - nexova-network
    command: >
      sh -c "/start.sh"

networks:
  nexova-network:
    name: nexova-network
    driver: bridge

volumes:
  redis-data: